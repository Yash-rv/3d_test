<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Strategy - Digital Marketing</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            color: white;
            font-family: 'Montserrat', sans-serif;
            cursor: default;
        }
        
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: rgba(0, 0, 0, 0.98);
            z-index: 10;
            color: white;
            font-size: 24px;
            transition: opacity 0.5s ease;
        }
        
        #loading .progress {
            width: 300px;
            height: 6px;
            background-color: #111;
            border-radius: 3px;
            margin-top: 20px;
            overflow: hidden;
        }
        
        #loading .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #4488ff, #8844ff);
            transition: width 0.3s ease;
        }
        
        #intro-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 52px;
            font-weight: 700;
            text-align: center;
            color: white;
            text-shadow: 0 0 20px rgba(0, 100, 255, 0.8);
            opacity: 0;
            transition: opacity 1s ease-in-out;
            z-index: 5;
            white-space: nowrap;
            pointer-events: none; /* Ensure it doesn't interfere with user interaction */
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @keyframes pulse {
            0% { opacity: 0.7; }
            50% { opacity: 1; }
            100% { opacity: 0.7; }
        }
        
        /* Add link to Google Fonts */
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;900&display=swap');
    </style>
</head>
<body>
    <div id="loading">
        <div>Loading Chess Experience...</div>
        <div class="progress">
            <div class="progress-bar"></div>
        </div>
    </div>
    
    <div id="intro-text">Make Your Strategic Move</div>
    
    <script type="module" src="chessboard.js"></script>
</body>
</html>
